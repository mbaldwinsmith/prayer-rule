<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A personal Orthodox morning and evening prayer rule." />
  <meta name="theme-color" content="#f5efe0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Prayer Rule</title>
</head>
<body>
  <header>
    <h1>Prayer Rule</h1>
    <nav class="office-nav" aria-label="Select office">
      <button data-office="morning">Morning</button>
      <button data-office="evening">Evening</button>
    </nav>
    <button id="install-btn" hidden aria-label="Install app">Install</button>
    <div id="streak" hidden aria-label="Current streak"></div>
    <button id="theme-toggle" aria-label="Toggle day/night mode">Night</button>
  </header>
  <main id="office"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
